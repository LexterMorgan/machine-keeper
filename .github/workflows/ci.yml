name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: node --test test/
      - name: Smoke test the CLI
        if: matrix.os == 'macos-latest'
        run: node bin/mk.mjs rules

  # SwiftPM plus the hand-assembled bundle. Node is here only because the
  # Makefile reads package.json for the bundle version; mk is not needed.
  # macOS 15 is pinned because the package's deployment target is macOS 15 and
  # the image ships Swift 6; `macos-latest` can drift ahead of both.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Swift package
        run: swift test --package-path app
      - name: Build the app bundle
        run: make app
      - name: Verify the bundle layout
        run: |
          test -x "dist/MachineKeeper.app/Contents/MacOS/MachineKeeper"
          test -f "dist/MachineKeeper.app/Contents/Info.plist"
